name: streetlore
description: Discover the unseen stories of your city with Streetlore.
publish_to: 'none'
version: 1.0.63+64

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.2

  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  http: ^1.2.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6

  supabase_flutter: ^2.5.6
  supabase: ^2.5.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.2.1
  permission_handler: ^11.3.0
  uuid: ^4.4.0
  flutter_compass: ^0.8.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  app_links: ^6.3.2
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/streetlore_logo.png
    - assets/images/splash_logo.png
    - assets/images/compass_only.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
